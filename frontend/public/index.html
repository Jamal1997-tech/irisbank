<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏦</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
    .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4">
          <div class="text-center mb-4">
            <i class="fas fa-university fa-3x text-primary mb-3"></i>
            <h2 class="fw-bold">IRIS Bank</h2>
            <p class="text-muted">Votre banque en ligne sécurisée</p>
          </div>

          <!-- Onglets Connexion/Inscription -->
          <ul class="nav nav-tabs mb-4" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Connexion</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Inscription</button>
            </li>
          </ul>

          <div class="tab-content" id="authTabsContent">
            <!-- Connexion -->
            <div class="tab-pane fade show active" id="login" role="tabpanel">
              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                  <input type="email" class="form-control" id="loginEmail" required>
                </div>
                <div class="mb-3">
                  <label class="form-label"><i class="fas fa-lock"></i> Mot de passe</label>
                  <input type="password" class="form-control" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  <i class="fas fa-sign-in-alt"></i> Se connecter
                </button>
              </form>
            </div>

            <!-- Inscription -->
            <div class="tab-pane fade" id="register" role="tabpanel">
              <form id="registerForm">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label"><i class="fas fa-user"></i> Nom</label>
                    <input type="text" class="form-control" id="nom" required>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label"><i class="fas fa-user"></i> Prénom</label>
                    <input type="text" class="form-control" id="prenom" required>
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                  <input type="email" class="form-control" id="registerEmail" required>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label"><i class="fas fa-phone"></i> Téléphone</label>
                    <input type="tel" class="form-control" id="telephone">
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label"><i class="fas fa-calendar"></i> Date de naissance</label>
                    <input type="date" class="form-control" id="date_naissance" required>
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label"><i class="fas fa-map-marker-alt"></i> Adresse</label>
                  <textarea class="form-control" id="adresse" rows="2"></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label"><i class="fas fa-lock"></i> Mot de passe</label>
                  <input type="password" class="form-control" id="registerPassword" required>
                </div>
                <button type="submit" class="btn btn-success w-100">
                  <i class="fas fa-user-plus"></i> S'inscrire
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
        <i class="fas fa-info-circle me-2"></i>
        <strong class="me-auto" id="toastTitle">Notification</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body" id="toastMessage"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
