<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur - IRIS Bank</title>
    <meta name="theme-color" content="#0b0f19">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏦</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 15% 15%, rgba(139, 92, 246, .22), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(99, 102, 241, .18), transparent 50%),
                #080b13;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 22px;
            padding: 3rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 24px 60px rgba(0,0,0,.5);
            max-width: 460px;
        }
        .error-icon {
            width: 84px;
            height: 84px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            border-radius: 20px;
            font-size: 2.2rem;
            color: #f43f5e;
            background: rgba(244, 63, 94, .12);
            border: 1px solid rgba(244, 63, 94, .25);
        }
        .error-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 1.75rem;
            margin-bottom: 1rem;
            color: #ffffff;
        }
        .error-message {
            font-size: 1rem;
            margin-bottom: 2rem;
            color: #97a2bd;
        }
        .btn-custom {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 999px;
            color: white;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            display: inline-block;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(99, 102, 241, 0.4);
            color: white;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <i class="fas fa-exclamation-triangle error-icon"></i>
        <h1 class="error-title">Une erreur s'est produite</h1>
        <p class="error-message">
            Nous rencontrons un problème technique. Nos équipes ont été notifiées et travaillent à résoudre le problème.
        </p>
        <a href="/" class="btn btn-custom">
            <i class="fas fa-home me-2"></i>Retour à l'accueil
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
